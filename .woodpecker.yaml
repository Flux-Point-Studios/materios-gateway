# `test` reports ci/woodpecker/pr/woodpecker, which main's branch protection
# requires; `publish` builds + pushes the GHCR image on main merges only.
when:
  - event: [push, pull_request]
    branch: main
  - event: manual

steps:
  - name: test
    image: node:20-bookworm
    commands:
      - npm ci
      # Install chromium into $HOME/.cache/ms-playwright so the browser E2E test RUNS
      # rather than self-skipping (its detector checks that exact path).
      - npx playwright install --with-deps chromium
      - npm run typecheck
      - npm test
      - npm run build   # emits dist/ into the shared workspace for the publish step's COPY

  # Build + push the image on main merges only (never on PRs → no push from an
  # untrusted PR context). Kaniko builds in userspace (no privileged/docker.sock),
  # so it grants no more than the `test` step already has on this shared host.
  # plugin-kaniko prefixes `registry` to `repo`, so `repo` must not repeat ghcr.io.
  - name: publish
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: ghcr.io
      repo: flux-point-studios/materios-gateway
      dockerfile: Dockerfile
      tags:
        - latest
        - ${CI_COMMIT_SHA}
      username: realdecimalist
      password:
        from_secret: gchr_token
    when:
      - event: push
        branch: main
